[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airpay"
version = "0.1.0"
description = "Official AirPay Python SDK."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AirPay", email = "hello@airpay.dev" }]
keywords = ["airpay", "payments", "crypto", "stablecoin", "usdc", "checkout"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://airpay.dev"
Documentation = "https://airpay.dev/docs"
Repository = "https://github.com/arindam923/airpay"
Issues = "https://github.com/arindam923/airpay/issues"

[tool.setuptools.packages.find]
include = ["airpay*"]

[tool.setuptools.package-data]
airpay = ["py.typed"]
