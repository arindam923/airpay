name: PHP SDK

on:
  push:
    paths:
      - "sdk/php/**"
      - ".github/workflows/php-sdk.yml"
  pull_request:
    paths:
      - "sdk/php/**"
      - ".github/workflows/php-sdk.yml"

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]
    defaults:
      run:
        working-directory: sdk/php
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Lint
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Test
        run: composer test
