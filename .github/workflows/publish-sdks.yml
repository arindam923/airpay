name: Publish SDKs

on:
  workflow_dispatch:
    inputs:
      sdk:
        description: SDK to publish
        required: true
        type: choice
        default: all
        options:
          - all
          - typescript
          - js
          - python
          - php
          - go
      version:
        description: Version to publish, without a leading "v" (must match the package manifest)
        required: true
        type: string
      dry_run:
        description: Build and validate without publishing
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-sdks-${{ inputs.sdk }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  DRY_RUN: ${{ inputs.dry_run }}
  PHP_SPLIT_REPOSITORY: ${{ vars.PHP_SPLIT_REPOSITORY || 'arindam923/airpay-php' }}

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    steps:
      - name: Check semver
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$VERSION' is not a valid semver version."
            exit 1
          fi

  publish-typescript:
    name: Publish @airpay/sdk
    needs: validate
    if: ${{ inputs.sdk == 'all' || inputs.sdk == 'typescript' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify package versions
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const src = fs.readFileSync("src/index.ts", "utf8");
            const embedded = src.match(/VERSION\s*=\s*"([^"]+)"/)?.[1];
            if (pkg.version !== process.env.VERSION) {
              console.error(`package.json is ${pkg.version}, workflow input is ${process.env.VERSION}`);
              process.exit(1);
            }
            if (embedded !== pkg.version) {
              console.error(`VERSION constant is ${embedded}, package.json is ${pkg.version}`);
              process.exit(1);
            }
          '

      - name: Build and inspect package
        run: |
          npm run build
          npm pack --dry-run

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --dry-run --access public
          else
            npm publish --access public --provenance
          fi

  publish-js:
    name: Publish @airpay/js
    needs: validate
    if: ${{ inputs.sdk == 'all' || inputs.sdk == 'js' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: sdk/js/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify package versions
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const src = fs.readFileSync("src/index.ts", "utf8");
            const embedded = src.match(/VERSION\s*=\s*"([^"]+)"/)?.[1];
            if (pkg.version !== process.env.VERSION) {
              console.error(`package.json is ${pkg.version}, workflow input is ${process.env.VERSION}`);
              process.exit(1);
            }
            if (embedded !== pkg.version) {
              console.error(`VERSION constant is ${embedded}, package.json is ${pkg.version}`);
              process.exit(1);
            }
          '

      - name: Build and inspect package
        run: |
          npm run build
          npm pack --dry-run

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --dry-run --access public
          else
            npm publish --access public --provenance
          fi

  publish-python:
    name: Publish airpay (PyPI)
    needs: validate
    if: ${{ inputs.sdk == 'all' || inputs.sdk == 'python' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify package versions
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import tomllib

          expected = os.environ["VERSION"]
          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          version = pyproject["project"]["version"]
          init = pathlib.Path("airpay/__init__.py").read_text()
          embedded = re.search(r'__version__\s*=\s*"([^"]+)"', init).group(1)

          if version != expected:
              raise SystemExit(f"pyproject.toml is {version}, workflow input is {expected}")
          if embedded != version:
              raise SystemExit(f"__version__ is {embedded}, pyproject.toml is {version}")
          PY

      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: skipping twine upload."
          else
            python -m twine upload --non-interactive dist/*
          fi

  publish-go:
    name: Release Go module
    needs: validate
    if: ${{ inputs.sdk == 'all' || inputs.sdk == 'go' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.mod
          cache: false

      - name: Test module
        run: go test ./...

      - name: Create release tag
        if: ${{ inputs.dry_run == false }}
        working-directory: .
        run: |
          TAG="sdk/go/v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}"
          git push origin "${TAG}"

  publish-php:
    name: Publish airpay/airpay (Packagist)
    needs: validate
    if: ${{ inputs.sdk == 'all' || inputs.sdk == 'php' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/php
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Validate package
        run: |
          composer validate --strict
          find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Test
        run: composer test

      - name: Split package into its own repository
        if: ${{ inputs.dry_run == false }}
        working-directory: .
        env:
          SPLIT_TOKEN: ${{ secrets.SDK_SPLIT_TOKEN }}
        run: |
          if [ -z "$SPLIT_TOKEN" ]; then
            echo "::error::SDK_SPLIT_TOKEN is required to publish the PHP package."
            exit 1
          fi

          SPLIT_SHA="$(git subtree split --prefix=sdk/php)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "v${VERSION}" "$SPLIT_SHA"

          git push --force \
            "https://x-access-token:${SPLIT_TOKEN}@github.com/${PHP_SPLIT_REPOSITORY}.git" \
            "${SPLIT_SHA}:refs/heads/main" \
            "refs/tags/v${VERSION}"

      - name: Trigger Packagist update
        if: ${{ inputs.dry_run == false }}
        working-directory: .
        env:
          PACKAGIST_USERNAME: ${{ vars.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
        run: |
          if [ -z "$PACKAGIST_USERNAME" ] || [ -z "$PACKAGIST_API_TOKEN" ]; then
            echo "::warning::PACKAGIST_USERNAME or PACKAGIST_API_TOKEN is not set; Packagist will update from its GitHub webhook."
            exit 0
          fi

          curl --fail-with-body -sS -X POST \
            -H "Content-Type: application/json" \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_API_TOKEN}" \
            -d "{\"repository\":{\"url\":\"https://github.com/${PHP_SPLIT_REPOSITORY}\"}}"
